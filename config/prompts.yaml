# 카테고리별 분석 프롬프트
prompts:
  crypto:
    comprehensive: |
      다음은 암호화폐/블록체인 관련 YouTube 영상의 자막입니다. 암호화폐 투자자 관점에서 분석해주세요:

      {content}

      다음 항목을 JSON 형식으로 분석해주세요:

      1. **언급된 암호화폐**
         - 코인/토큰 목록
         - 각각에 대한 언급 빈도 및 중요도

      2. **시장 분석**
         - 현재 시장 상황 평가
         - 가격 전망 (상승/하락/횡보)
         - 주요 근거 및 이유

      3. **투자 시그널**
         - 매수/매도/보유 시그널
         - 추천 진입/청산 포인트 (언급된 경우)
         - 투자 전략

      4. **기술적 분석**
         - 차트 패턴 분석 (언급된 경우)
         - 주요 지표 (RSI, 이동평균선 등)
         - 지지/저항선

      5. **펀더멘털 분석**
         - 프로젝트 업데이트 및 뉴스
         - 파트너십, 상장 등 이벤트
         - 개발 진행 상황

      6. **리스크 요인**
         - 투자 위험 요소
         - 주의사항
         - 손절 포인트 (언급된 경우)

      7. **신뢰도 평가** (0-100)
         - 정보의 객관성
         - 근거의 타당성
         - 전문성 수준

      8. **핵심 요약**
         - 3줄 요약
         - 투자자를 위한 액션 아이템

    sentiment: |
      다음 암호화폐 관련 영상의 시장 심리를 분석해주세요:

      {content}

      JSON 형식으로 응답:
      1. 전반적인 시장 심리 (매우 긍정/긍정/중립/부정/매우 부정)
      2. Fear & Greed 지수 예상 (0-100)
      3. 주요 감정 키워드
      4. 투자 심리 분석

    summary: |
      암호화폐 영상을 투자자 관점에서 요약해주세요:

      {content}

      1. 3줄 요약
      2. 주요 코인/토큰
      3. 핵심 투자 포인트 3가지
      4. 주의사항

  finance:
    comprehensive: |
      다음은 금융/투자 관련 YouTube 영상의 자막입니다. 투자자 관점에서 분석해주세요:

      {content}

      JSON 형식으로 분석:

      1. **주요 주제**
         - 다루는 금융 상품 (주식, 채권, 부동산 등)
         - 핵심 테마

      2. **투자 전략**
         - 제시된 투자 전략
         - 포트폴리오 구성 제안
         - 자산 배분 방법

      3. **시장 분석**
         - 현재 시장 상황
         - 경제 지표 분석
         - 전망 (단기/중기/장기)

      4. **추천 종목/자산**
         - 언급된 종목이나 자산
         - 추천 이유
         - 목표가 및 기간

      5. **리스크 관리**
         - 위험 요소
         - 헤지 전략
         - 손절/익절 전략

      6. **실행 계획**
         - 구체적인 투자 방법
         - 타이밍 전략
         - 주의사항

      7. **전문성 평가** (0-100)
      8. **핵심 요약** (3-5줄)

    sentiment: |
      금융 시장에 대한 영상의 심리 분석:

      {content}

      1. 시장 전망 (강세/약세/중립)
      2. 투자 심리 지수 (0-100)
      3. 리스크 온/오프 판단
      4. 주요 우려 사항

    summary: |
      금융/투자 영상 요약:

      {content}

      1. 3줄 요약
      2. 주요 투자 아이디어
      3. 핵심 리스크
      4. 액션 아이템

  tech:
    comprehensive: |
      다음은 기술/IT 관련 YouTube 영상의 자막입니다:

      {content}

      JSON 형식으로 분석:

      1. **주요 기술**
         - 다루는 기술 스택
         - 프로그래밍 언어/프레임워크

      2. **핵심 개념**
         - 설명하는 주요 개념
         - 기술적 원리

      3. **실용성**
         - 실무 적용 가능성
         - 사용 사례
         - 장단점

      4. **난이도** (초급/중급/고급)

      5. **학습 포인트**
         - 핵심 학습 내용
         - 주요 코드/예제
         - 베스트 프랙티스

      6. **관련 기술**
         - 연관 기술 및 도구
         - 대안 기술

      7. **요약** (기술자 관점)

    summary: |
      기술 영상 요약:

      {content}

      1. 3줄 요약
      2. 주요 기술 키워드
      3. 학습 난이도
      4. 핵심 takeaway

  news:
    comprehensive: |
      뉴스/시사 영상 분석:

      {content}

      JSON 형식:

      1. **주요 이슈**
      2. **핵심 내용**
      3. **관련 당사자/기관**
      4. **영향 및 파급 효과**
      5. **향후 전망**
      6. **객관성 평가** (0-100)
      7. **요약**

    summary: |
      뉴스 요약:

      {content}

      1. 헤드라인 (1줄)
      2. 핵심 내용 (3줄)
      3. 주요 키워드
      4. 영향 평가

  business:
    comprehensive: |
      비즈니스/창업 영상 분석:

      {content}

      JSON 형식:

      1. **비즈니스 모델**
      2. **주요 전략**
      3. **성공 요인**
      4. **도전 과제**
      5. **실행 방법**
      6. **적용 가능성**
      7. **핵심 인사이트**

    summary: |
      비즈니스 영상 요약:

      {content}

      1. 3줄 요약
      2. 핵심 비즈니스 아이디어
      3. 적용 가능한 전략
      4. 주요 시사점

  education:
    comprehensive: |
      교육 콘텐츠 분석:

      {content}

      JSON 형식:

      1. **학습 목표**
      2. **주요 내용**
      3. **난이도**
      4. **필요한 선수 지식**
      5. **실습/예제**
      6. **핵심 개념**
      7. **요약**

    summary: |
      교육 영상 요약:

      {content}

      1. 무엇을 배우는가 (1줄)
      2. 주요 학습 내용 (3줄)
      3. 대상 학습자
      4. 핵심 takeaway

  general:
    comprehensive: |
      YouTube 영상 종합 분석:

      {content}

      JSON 형식:

      1. **핵심 주제**
      2. **주요 내용**
      3. **타겟 청중**
      4. **주요 메시지**
      5. **감성 분석**
      6. **실용적 인사이트**
      7. **요약**

    sentiment: |
      영상 감성 분석:

      {content}

      1. 전반적 감성 (긍정/부정/중립)
      2. 감정 점수 (0-100)
      3. 주요 감정 키워드
      4. 톤 및 스타일

    summary: |
      영상 요약:

      {content}

      1. 3줄 요약
      2. 핵심 키워드 (5개)
      3. 주요 포인트
      4. 결론

# 분류를 위한 프롬프트
classification_prompt: |
  다음 YouTube 영상의 제목과 간단한 설명을 보고, 가장 적합한 카테고리를 분류해주세요.

  제목: {title}
  설명: {description}

  카테고리 옵션:
  - crypto: 암호화폐/블록체인
  - finance: 금융/투자 (주식, 채권, 부동산 등)
  - tech: 기술/IT
  - news: 뉴스/시사
  - business: 비즈니스/창업
  - education: 교육/강의
  - general: 일반

  JSON 형식으로 응답:
  {{
    "category": "카테고리명",
    "confidence": 0-100,
    "reason": "분류 이유"
  }}
